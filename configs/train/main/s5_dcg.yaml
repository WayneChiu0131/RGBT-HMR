# Stage 5: Deep Cross-modal Gate (DCG). The fusion branch reads the frozen RGB branch at
# ViT-H blocks 15/19/23/27/31 and updates x <- x + beta * (r - x).
# Init: s4_refine/checkpoint_best. Trains: DCG only (ARG / MA frozen). LLVIP paired only.
# Output = released model (export with tools/export_release_weights.py).
# Run from the repo root: python train.py --train_cfg configs/train/main/s5_dcg.yaml --paths_cfg configs/paths/local.yaml

EXPERIMENT:
  NAME: s5_dcg
  TIME_TO_RUN: 86400000
  RESUME: false

IO:
  LOG_DIR: logs/main
  CHECKPOINT: null
  # Scheme-3b best (RGBIR 13.257, OTP2-trained adapters + frozen gate). Body/IR
  # adapters carry LEARNED raw_scale -> keep MAX_SCALE fixed (coupling rule).
  PRETRAINED_CHECKPOINT: logs/main/s4_refine/checkpoints/checkpoint_best.pt

MODEL:
  TYPE: mmped_unified_hmr2
  CORE_TYPE: hmr2
  HMR2_CHECKPOINT: weights/hmr2/epoch=35-step=1000000.ckpt
  FREEZE_CORE: true
  FREEZE_HMR2_BODY: true
  FREEZE_HEAD: true

  BACKBONE: vitpose_huge
  IMG_RES: 256
  PRETRAINED_INIT: true
  STRICT_VITPOSE: true
  VITPOSE_CHECKPOINT: null  # unused with CORE_TYPE=hmr2
  VITPOSE_INPUT_HEIGHT: 256
  VITPOSE_INPUT_WIDTH: 192
  VITPOSE_CENTER_CROP_INPUT: true
  VITPOSE_FREEZE: true
  VITPOSE_POOL: token

  HMR_HEAD_TYPE: transformer_decoder
  DECODER_DIM: 1024
  DECODER_DEPTH: 1
  DECODER_HEADS: 8
  DECODER_MLP_RATIO: 4.0
  DECODER_DROPOUT: 0.0

  CAMERA_REP: weak_perspective
  USE_BBOX_TOKEN: false
  WEAK_CAM_SCALE_MIN: 0.05
  WEAK_CAM_SCALE_MAX: 10.0
  MODALITY_EMBED_DIM: 0
  NUM_MODALITIES: 3

  TRAIN_UNIFIED_ENCODER: false
  TRAIN_IR_TOKEN_ADAPTER: false
  TRAIN_BODY_ADAPTER: false
  XMODAL_DEEP_ENABLE: true
  XMODAL_DEEP_BLOCKS: [15, 19, 23, 27, 31]
  XMODAL_DEEP_TYPE: convex
  XMODAL_DEEP_BOTTLENECK_DIM: 128
  XMODAL_DEEP_DROPOUT: 0.0
  XMODAL_DEEP_INIT_LOGIT: -4.0
  TRAIN_XMODAL_DEEP: true
  # Scheme-3b: freeze the per-token gate (per_token_conf_mlp). Everything else in
  # the unified encoder + adapters keeps training. Cuts the gate-drift feedback.
  TRAIN_GATE: false

  UNIFIED_ENCODER:
    USE_CMT: false
    TYPE: mmped_style_hmr2
    DIM: 1280
    DEPTH: 1
    HEADS: 8
    MLP_RATIO: 2.0
    DROPOUT: 0.0
    CONF_INIT_IR: 0.70
    MAA_RESIDUAL_MAX_SCALE: 0.0
    USE_PER_TOKEN_CONFIDENCE: true
    PER_TOKEN_CONF_HIDDEN_DIM: 256
    USE_DIRECT_CONFIDENCE: false
    USE_MAF_CONFIDENCE: false
    CONF_MAX_LOGIT_DELTA: 1.0
    GATE_ANCHOR_IR: 0.70

  IR_TOKEN_ADAPTER:
    ENABLE: false
    DIM: 1280
    BOTTLENECK_DIM: 64
    # 0.02 -> 0.05: Scheme-2 showed the IR adapter saturated against 0.02.
    MAX_SCALE: 0.05
    INIT_RAW_SCALE: 0.0

  BODY_ADAPTER:
    ENABLE: true
    # last-16 of 32 ViT-H -> indices [16..31].
    NUM_BLOCKS: 16
    TOTAL_BLOCKS: 32
    DIM: 1280
    BOTTLENECK_DIM: 64
    MAX_SCALE: 0.01
    INIT_RAW_SCALE: 0.0

  # Scheme-3c: thermal-teacher distillation on ir_only rows (SMPL-param output).
  DISTILL:
    ENABLE: false
    TEACHER_CHECKPOINT: null  # distillation disabled
    # rotmat MSE (elements in [-1,1]) -> pose term ~0.025 matches the ~0.03
    # weighted 2D loss. betas MSE is ~1 order larger (betas range ~[-3,3]), so
    # BETA_WEIGHT is set 25x smaller to keep the beta term (~0.06) balanced.
    # Sanity-verified magnitudes: pose_term=0.025, beta_term(0.02)=0.064.
    POSE_WEIGHT: 1.0
    BETA_WEIGHT: 0.02

CAMERA:
  FOCAL_ESTIMATE_MODE: diagonal
  FOCAL_POLICY: real_else_fixed
  FIXED_FOCAL: 5000.0
  LOG_FOCAL_SOURCE: true

DATASET:
  LIST:
    - llvip-pgt
  # LLVIP 0.6 keeps gate/rgbir training dominant (RGBIR must not regress);
  # OTP2 0.4 injects real IR-only signal for the IR bottleneck.
  PARTITION:
    - 1.0
  NPZ_OVERRIDES: null

MODALITY_DROPOUT:
  ENABLED: true
  LLVIP_RGB_ONLY_PROB: 0.0
  LLVIP_IR_ONLY_PROB: 0.0
  LLVIP_RGBIR_PROB: 1.0

AUG:
  USE_AUGMENTATION: true
  ROT_FACTOR: 15.0
  NOISE_FACTOR: 0.15
  SCALE_FACTOR: 0.15
  ROT_ZERO_PROB: 0.5
  OCC_PROB: 0.0
  FLIP_PROB: 0.5
  EXTREME_CROP_AUG_RATE: 0.0
  EXTREME_CROP_AUG_LEVEL: 0
  THERMAL_LIKE_PROB: 0.0
  INVERT_PROB: 0.0
  CLAHE_PROB: 0.0
  THERMAL_NOISE_PROB: 0.0

LOSS:
  SUPERVISION_MODE: gt_only
  KEYPOINT_2D_LOSS_WEIGHT: 10.0

  KEYPOINT_2D_LOSS_BETA: 0.05

  KEYPOINT_2D_PIXEL_LOSS_WEIGHT: 0.0
  KEYPOINT_3D_LOSS_WEIGHT: 0.0
  POSE_LOSS_WEIGHT: 1.0
  BETA_LOSS_WEIGHT: 0.1
  BETA_LOSS_FILTER_ENABLED: true
  BETA_LOSS_THRESHOLD: 5.0
  SHAPE_LOSS_WEIGHT: 0.0
  CAM_DEPTH_LOSS_WEIGHT: 0.0
  CAM_LOSS_WEIGHT: 0.0
  CAM_FULL_LOSS_WEIGHT: 0.0
  CAM_FULL_LOSS_START_STEP: 0
  CAM_FULL_LOSS_RAMP_STEPS: 0
  OPENPOSE_TRAIN_WEIGHT: 1.0
  GT_TRAIN_WEIGHT: 1.0
  USE_PGT_WEIGHT: true


  # Gate is frozen this run -> anchor is redundant (would only perturb the IR
  # adapter through the shared feat). Set to 0.
  GATE_ANCHOR_LOSS_WEIGHT: 0.0
  ORACLE_GATE_LOSS_WEIGHT: 0.0
  ORACLE_GATE_TARGET_NPZ: null
  ORACLE_GATE_RAMP_STEPS: 1000

SMPLIFY:
  RUN: false

TRAIN:
  NUM_EPOCHS: 200
  MAX_STEP: 10000
  LR: 2.0e-5
  LR_SCHEDULE: cosine_warmup
  WARMUP_STEPS: 500
  BACKBONE_LR: 0.0
  HEAD_LR: 0.0
  CAM_HEAD_LR: 0.0
  UNIFIED_ENCODER_LR: 2.0e-5
  IR_TOKEN_ADAPTER_LR: 5.0e-5
  BODY_ADAPTER_LR: 1.0e-5
  XMODAL_DEEP_LR: 5.0e-5
  BATCH_SIZE: 8
  WEIGHT_DECAY: 1.0e-4
  OPTIMIZER: adamw
  GRAD_CLIP_NORM: 0.5
  SAVE_STEP: 0

VALIDATION:
  ENABLED: true
  INTERVAL: 1000
  DATASET: llvip-pgt
  METRIC: MPJPE
  SAVE_BEST: true
  SAVE_BEST_TIMESTAMPED: false
  PRIMARY_METRIC: llvip-pgt/rgbir/2D-MPJPE
  BATCH_SIZE: 8
  NUM_WORKERS: 4

DATALOADER:
  NUM_WORKERS: 4
  PIN_MEMORY: true
  SHUFFLE_TRAIN: true

LOGGING:
  SUMMARY_STEPS: 100
  RENDER_SUMMARIES: false
  LOSS_RECORD_STEPS: 50

DEBUG:
  IGNORE_3D: false
  SKIP_DATASET_IMAGE_CHECK: true

BASELINE:
  RUN_STEP0_VALIDATION: true
  COMPARE_TO_STEP0: true
  EARLY_STOP_ENABLED: true
  EARLY_STOP_ABORT: true
  EARLY_STOP_START_STEP: 0
  NAN_GUARD: true
  RGBIR_FAIL_MARGIN_PX: 1.0
  RGBIR_FAIL_CONSECUTIVE: 2
  GATE_IR_COLLAPSE_THRESHOLD: 0.995
